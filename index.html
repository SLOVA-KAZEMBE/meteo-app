<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Météo 7 Jours – Open-Meteo</title>

    <!-- Google Fonts & Font Awesome & Weather Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css" />

    <style>
        /* ===== RESET & BASE ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-start: #0b0e1a;
            --bg-end: #1a1f35;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.10);
            --glass-blur: 20px;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.70);
            --text-muted: rgba(255, 255, 255, 0.45);
            --accent: #6c8cff;
            --accent-glow: rgba(108, 140, 255, 0.30);
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
            --radius: 24px;
            --radius-sm: 14px;
            --transition: 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --font: 'Inter', sans-serif;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            background: linear-gradient(145deg, var(--bg-start), var(--bg-end));
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
            background-attachment: fixed;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 20px;
        }

        /* ===== APP CONTAINER ===== */
        .app {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px 24px;
            padding: 8px 4px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo i {
            font-size: 2rem;
            color: var(--accent);
            filter: drop-shadow(0 0 20px var(--accent-glow));
        }

        .logo h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 50%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo span {
            font-weight: 300;
            -webkit-text-fill-color: var(--text-secondary);
            opacity: 0.7;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 520px;
        }

        .search-wrapper i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
            pointer-events: none;
        }

        .search-wrapper input {
            width: 100%;
            padding: 16px 50px 16px 48px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-radius: 60px;
            color: #fff;
            font-size: 1rem;
            font-family: var(--font);
            outline: none;
            transition: var(--transition);
            letter-spacing: 0.2px;
        }

        .search-wrapper input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .search-wrapper input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow), 0 0 30px rgba(108, 140, 255, 0.08);
            background: rgba(255, 255, 255, 0.08);
        }

        .search-wrapper .btn-search {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--accent);
            border: none;
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-wrapper .btn-search:hover {
            transform: translateY(-50%) scale(1.05);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        /* ===== MAIN GRID ===== */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1.6fr;
            gap: 24px;
        }

        /* ===== CARDS ===== */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-radius: var(--radius);
            padding: 28px 30px;
            transition: var(--transition);
            box-shadow: var(--shadow);
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.16);
        }

        /* ===== CURRENT WEATHER ===== */
        .current-weather {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .current-weather .city {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .current-weather .city i {
            color: var(--accent);
            font-size: 1.2rem;
        }

        .current-weather .city .date {
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--text-secondary);
            margin-left: auto;
        }

        .weather-main {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .weather-main .temp {
            font-size: 4.2rem;
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 1;
        }

        .weather-main .temp sup {
            font-size: 1.6rem;
            font-weight: 400;
            top: -0.6em;
            color: var(--text-secondary);
        }

        .weather-main .icon-temp {
            font-size: 4.2rem;
            line-height: 1;
            filter: drop-shadow(0 0 30px var(--accent-glow));
            color: #fbbf24; /* couleur par défaut, sera surchargée par la classe */
        }

        .weather-main .condition {
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 14px;
            margin-top: 8px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .detail-item i {
            font-size: 1.1rem;
            color: var(--accent);
            width: 22px;
            text-align: center;
        }

        .detail-item .info {
            display: flex;
            flex-direction: column;
        }

        .detail-item .info .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .detail-item .info .value {
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* ===== 7-DAY FORECAST ===== */
        .forecast-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .forecast-section .section-title {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .forecast-section .section-title i {
            color: var(--accent);
        }

        .forecast-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .forecast-day {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-sm);
            transition: var(--transition);
            cursor: default;
            gap: 12px;
            flex-wrap: wrap;
            border: 1px solid transparent;
        }

        .forecast-day:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.06);
        }

        .forecast-day .day {
            font-weight: 500;
            min-width: 70px;
            font-size: 0.95rem;
        }

        .forecast-day .day .short {
            display: none;
        }

        .forecast-day .icon-forecast {
            font-size: 2rem;
            min-width: 44px;
            text-align: center;
            filter: drop-shadow(0 0 12px var(--accent-glow));
            color: #fbbf24;
        }

        .forecast-day .desc {
            flex: 1;
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-align: left;
            padding: 0 6px;
        }

        .forecast-day .temps {
            display: flex;
            align-items: center;
            gap: 14px;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .forecast-day .temps .high {
            color: #fff;
        }
        .forecast-day .temps .low {
            color: var(--text-muted);
        }

        .forecast-day .temps .sep {
            color: var(--text-muted);
            font-weight: 300;
        }

        .forecast-day .precip {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
            min-width: 48px;
        }

        .forecast-day .precip i {
            color: #6bc5f7;
            font-size: 0.8rem;
        }

        /* ===== STATE MESSAGES ===== */
        .state-message {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
            text-align: center;
            color: var(--text-secondary);
            gap: 14px;
            min-height: 260px;
        }

        .state-message i {
            font-size: 3.2rem;
            color: var(--text-muted);
            opacity: 0.5;
        }

        .state-message .sub {
            font-size: 0.9rem;
            color: var(--text-muted);
            max-width: 380px;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 255, 255, 0.08);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .current-weather .city .date {
                margin-left: 0;
                width: 100%;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 14px;
            }
            .app {
                gap: 20px;
            }
            .card {
                padding: 20px 18px;
            }
            .logo h1 {
                font-size: 1.3rem;
            }
            .logo i {
                font-size: 1.6rem;
            }
            .weather-main .temp {
                font-size: 3.2rem;
            }
            .weather-main .icon-temp {
                font-size: 3.2rem;
            }
            .search-wrapper {
                max-width: 100%;
            }
            .forecast-day {
                padding: 12px 14px;
                flex-wrap: wrap;
            }
            .forecast-day .day .full {
                display: none;
            }
            .forecast-day .day .short {
                display: inline;
            }
            .forecast-day .desc {
                font-size: 0.8rem;
                flex: 1 1 100%;
                padding-left: 0;
            }
            .forecast-day .temps {
                font-size: 0.85rem;
                gap: 10px;
            }
            .forecast-day .precip {
                min-width: auto;
            }
            .current-weather .city {
                font-size: 1.2rem;
            }
            .weather-details {
                grid-template-columns: 1fr 1fr;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .header-actions {
                justify-content: flex-end;
            }
        }

        @media (max-width: 480px) {
            .weather-main {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
            .weather-main .temp {
                font-size: 2.8rem;
            }
            .weather-main .icon-temp {
                font-size: 2.8rem;
            }
            .weather-details {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .detail-item .info .value {
                font-size: 0.85rem;
            }
            .forecast-day .temps {
                font-size: 0.8rem;
                gap: 6px;
            }
            .forecast-day .icon-forecast {
                font-size: 1.6rem;
                min-width: 32px;
            }
            .search-wrapper input {
                padding: 14px 44px 14px 42px;
                font-size: 0.9rem;
            }
            .search-wrapper .btn-search {
                width: 36px;
                height: 36px;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 380px) {
            .weather-details {
                grid-template-columns: 1fr;
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== STYLES SPÉCIFIQUES POUR LES ICÔNES MÉTÉO ===== */
        .wi {
            display: inline-block;
            font-size: inherit;
            line-height: 1;
        }
        .wi-forecast {
            font-size: 1.8rem;
        }
        .wi-current {
            font-size: 4.2rem;
        }
        /* Couleurs pour les différentes conditions */
        .wi-day-sunny,
        .wi-night-clear {
            color: #fbbf24;
        }
        .wi-cloudy,
        .wi-night-cloudy {
            color: #94a3b8;
        }
        .wi-rain,
        .wi-night-rain {
            color: #60a5fa;
        }
        .wi-snow,
        .wi-night-snow {
            color: #e2e8f0;
        }
        .wi-thunderstorm {
            color: #f59e0b;
        }
        .wi-fog {
            color: #9ca3af;
        }
        .wi-sleet {
            color: #93c5fd;
        }
    </style>
</head>
<body>

    <div class="app" id="app">

        <!-- HEADER -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-cloud-sun"></i>
                <h1>Météo<span>7</span></h1>
            </div>
            <div class="header-actions">
                <div class="search-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Rechercher une ville…" autocomplete="off" />
                    <button class="btn-search" id="searchBtn" aria-label="Rechercher">
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- MAIN GRID -->
        <div class="main-grid">

            <!-- CURRENT WEATHER -->
            <section class="card" id="currentCard">
                <div class="current-weather" id="currentWeather">
                    <div class="state-message">
                        <i class="fas fa-cloud-sun"></i>
                        <div style="font-weight:500;">Prévisions 7 jours</div>
                        <div class="sub">Entrez une ville pour afficher la météo</div>
                    </div>
                </div>
            </section>

            <!-- 7-DAY FORECAST -->
            <section class="card" id="forecastCard">
                <div class="forecast-section">
                    <div class="section-title">
                        <i class="fas fa-calendar-alt"></i> Prévisions sur 7 jours
                    </div>
                    <div class="forecast-list" id="forecastList">
                        <div class="state-message">
                            <i class="fas fa-cloud"></i>
                            <div class="sub">Les prévisions apparaîtront ici</div>
                        </div>
                    </div>
                </div>
            </section>

        </div>
    </div>

    <script>
        // ============================================================
        //  CONFIGURATION
        // ============================================================
        const DEFAULT_CITY = 'Lubumbashi'; // ← ville par défaut

        // ============================================================
        //  DOM REFS
        // ============================================================
        const $ = (sel) => document.querySelector(sel);
        const $$ = (sel) => document.querySelectorAll(sel);

        const searchInput = $('#searchInput');
        const searchBtn = $('#searchBtn');
        const currentWeather = $('#currentWeather');
        const forecastList = $('#forecastList');

        let isLoading = false;
        let currentCity = DEFAULT_CITY;

        // ============================================================
        //  API HELPERS (Open-Meteo)
        // ============================================================
        async function geocode(city) {
            const url =
                `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=fr&format=json`;
            const resp = await fetch(url);
            if (!resp.ok) throw new Error('Erreur de géocodage');
            const data = await resp.json();
            if (!data.results || data.results.length === 0) {
                throw new Error('Ville introuvable');
            }
            const result = data.results[0];
            return {
                name: result.name,
                country: result.country || '',
                latitude: result.latitude,
                longitude: result.longitude,
                timezone: result.timezone || 'auto'
            };
        }

        async function fetchWeather(lat, lon, timezone = 'auto') {
            const url =
                `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,pressure_msl,uv_index,visibility&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max&timezone=${encodeURIComponent(timezone)}&forecast_days=7&past_days=0`;
            const resp = await fetch(url);
            if (!resp.ok) throw new Error('Erreur météo');
            return resp.json();
        }

        // ============================================================
        //  MAPPING WMO → Weather Icons (weather-icons)
        // ============================================================
        function getWeatherIcon(wmoCode, isDay = true) {
            // Table de correspondance WMO → classe weather-icons
            const map = {
                0: isDay ? 'wi-day-sunny' : 'wi-night-clear',
                1: isDay ? 'wi-day-sunny-overcast' : 'wi-night-partly-cloudy',
                2: isDay ? 'wi-day-cloudy' : 'wi-night-cloudy',
                3: 'wi-cloudy',
                45: 'wi-fog',
                48: 'wi-fog',
                51: 'wi-sprinkle',
                53: 'wi-sprinkle',
                55: 'wi-sprinkle',
                56: 'wi-sleet',
                57: 'wi-sleet',
                61: 'wi-rain',
                63: 'wi-rain',
                65: 'wi-rain',
                66: 'wi-sleet',
                67: 'wi-sleet',
                71: 'wi-snow',
                73: 'wi-snow',
                75: 'wi-snow',
                77: 'wi-snow',
                80: 'wi-showers',
                81: 'wi-showers',
                82: 'wi-showers',
                85: 'wi-snow',
                86: 'wi-snow',
                95: 'wi-thunderstorm',
                96: 'wi-thunderstorm',
                99: 'wi-thunderstorm',
            };
            const iconClass = map[wmoCode] || (isDay ? 'wi-day-sunny' : 'wi-night-clear');
            return iconClass;
        }

        function getWeatherDescription(wmoCode) {
            const descMap = {
                0: 'Ciel dégagé',
                1: 'Principalement dégagé',
                2: 'Partiellement nuageux',
                3: 'Nuageux',
                45: 'Brouillard',
                48: 'Brouillard givrant',
                51: 'Bruine légère',
                53: 'Bruine modérée',
                55: 'Bruine forte',
                56: 'Bruine glacée légère',
                57: 'Bruine glacée forte',
                61: 'Pluie légère',
                63: 'Pluie modérée',
                65: 'Pluie forte',
                66: 'Pluie glacée légère',
                67: 'Pluie glacée forte',
                71: 'Neige légère',
                73: 'Neige modérée',
                75: 'Neige forte',
                77: 'Grains de neige',
                80: 'Averses de pluie légères',
                81: 'Averses de pluie modérées',
                82: 'Averses de pluie fortes',
                85: 'Averses de neige légères',
                86: 'Averses de neige fortes',
                95: 'Orage',
                96: 'Orage avec grêle légère',
                99: 'Orage avec grêle forte',
            };
            return descMap[wmoCode] || 'Inconnu';
        }

        // ============================================================
        //  RENDU
        // ============================================================
        function renderCurrent(data, locationInfo) {
            const current = data.current;
            const now = new Date();
            const dateStr = now.toLocaleDateString('fr-FR', {
                weekday: 'long',
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });

            const temp = Math.round(current.temperature_2m);
            const feels = Math.round(current.apparent_temperature);
            const humidity = current.relative_humidity_2m;
            const wind = Math.round(current.wind_speed_10m);
            const pressure = Math.round(current.pressure_msl);
            const uv = current.uv_index ? current.uv_index.toFixed(1) : '—';
            const vis = current.visibility ? Math.round(current.visibility / 1000) : '—';
            const precip = current.precipitation || 0;
            const precipText = precip > 0 ? `${precip.toFixed(1)} mm` : '0 mm';

            const wmo = current.weather_code;
            const isDay = true; // simplifié, on pourrait calculer avec l'heure
            const iconClass = getWeatherIcon(wmo, isDay);
            const description = getWeatherDescription(wmo);

            let html = `
                <div class="fade-in">
                    <div class="city">
                        <i class="fas fa-map-pin"></i>
                        ${locationInfo.name}, ${locationInfo.country}
                        <span class="date"><i class="far fa-calendar-alt" style="margin-right:6px;"></i>${dateStr}</span>
                    </div>
                    <div class="weather-main">
                        <div>
                            <div class="temp">${temp}<sup>°C</sup></div>
                            <div class="condition">${description}</div>
                        </div>
                        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
                            <div class="icon-temp wi ${iconClass} wi-current"></div>
                        </div>
                    </div>
                    <div class="weather-details">
                        <div class="detail-item">
                            <i class="fas fa-thermometer-half"></i>
                            <div class="info">
                                <span class="label">Ressenti</span>
                                <span class="value">${feels}°C</span>
                            </div>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-tint"></i>
                            <div class="info">
                                <span class="label">Humidité</span>
                                <span class="value">${humidity}%</span>
                            </div>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-wind"></i>
                            <div class="info">
                                <span class="label">Vent</span>
                                <span class="value">${wind} km/h</span>
                            </div>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-compress-alt"></i>
                            <div class="info">
                                <span class="label">Pression</span>
                                <span class="value">${pressure} hPa</span>
                            </div>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-sun"></i>
                            <div class="info">
                                <span class="label">UV</span>
                                <span class="value">${uv}</span>
                            </div>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-eye"></i>
                            <div class="info">
                                <span class="label">Visibilité</span>
                                <span class="value">${vis} km</span>
                            </div>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-cloud-rain"></i>
                            <div class="info">
                                <span class="label">Précipitations</span>
                                <span class="value">${precipText}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            currentWeather.innerHTML = html;
        }

        function renderForecast(data) {
            const daily = data.daily;
            if (!daily || !daily.time) {
                forecastList.innerHTML = `
                    <div class="state-message">
                        <i class="fas fa-cloud"></i>
                        <div class="sub">Aucune prévision disponible</div>
                    </div>
                `;
                return;
            }

            let html = '';
            const days = daily.time.length;
            for (let i = 0; i < days; i++) {
                const date = new Date(daily.time[i]);
                const dayName = date.toLocaleDateString('fr-FR', { weekday: 'long' });
                const shortDay = date.toLocaleDateString('fr-FR', { weekday: 'short' });
                const dayNum = date.getDate();

                const high = Math.round(daily.temperature_2m_max[i]);
                const low = Math.round(daily.temperature_2m_min[i]);
                const wmo = daily.weather_code[i];
                const iconClass = getWeatherIcon(wmo, true);
                const description = getWeatherDescription(wmo);
                const precipProb = daily.precipitation_probability_max ? Math.round(daily.precipitation_probability_max[
                    i]) : 0;
                const precipSum = daily.precipitation_sum ? daily.precipitation_sum[i].toFixed(1) : 0;

                let label = dayName;
                if (i === 0) label = 'Aujourd\'hui';
                else if (i === 1) label = 'Demain';

                html += `
                    <div class="forecast-day fade-in" style="animation-delay:${i * 0.04}s;">
                        <div class="day">
                            <span class="full">${label}</span>
                            <span class="short">${i === 0 ? 'Auj' : i === 1 ? 'Dem' : shortDay}</span>
                            <span style="color:var(--text-muted);font-weight:400;font-size:0.75rem;margin-left:4px;">${dayNum}</span>
                        </div>
                        <div class="icon-forecast wi ${iconClass} wi-forecast"></div>
                        <div class="desc">${description}</div>
                        <div class="temps">
                            <span class="high">${high}°</span>
                            <span class="sep">/</span>
                            <span class="low">${low}°</span>
                        </div>
                        <div class="precip">
                            ${precipProb > 0 ? `<i class="fas fa-cloud-rain"></i> ${precipProb}%` : '<i class="fas fa-sun" style="color:var(--text-muted);opacity:0.4;"></i>'}
                        </div>
                    </div>
                `;
            }
            forecastList.innerHTML = html;
        }

        function showError(message) {
            let title = '⚠️ Oups !';
            let sub = message;
            let icon = 'fa-exclamation-triangle';

            if (message.includes('introuvable')) {
                title = '🌍 Ville inconnue';
                sub = 'Vérifiez le nom de la ville ou essayez une autre.';
            } else if (message.includes('géocodage')) {
                title = '🔍 Erreur de recherche';
                sub = 'Impossible de localiser cette ville.';
            } else {
                sub = message || 'Une erreur est survenue. Vérifiez votre connexion.';
            }

            currentWeather.innerHTML = `
                <div class="state-message">
                    <i class="fas ${icon}" style="color:var(--accent);"></i>
                    <div style="font-weight:500;">${title}</div>
                    <div class="sub">${sub}</div>
                </div>
            `;
            forecastList.innerHTML = `
                <div class="state-message">
                    <i class="fas ${icon}" style="color:var(--accent);"></i>
                    <div class="sub">${sub}</div>
                </div>
            `;
        }

        function showLoading() {
            currentWeather.innerHTML = `
                <div class="state-message">
                    <div class="spinner"></div>
                    <div style="font-weight:500;">Chargement…</div>
                </div>
            `;
            forecastList.innerHTML = `
                <div class="state-message">
                    <div class="spinner"></div>
                    <div style="font-weight:500;">Chargement des prévisions…</div>
                </div>
            `;
        }

        // ============================================================
        //  LOAD WEATHER
        // ============================================================
        async function loadWeather(city) {
            if (isLoading) return;
            isLoading = true;
            showLoading();

            try {
                const geo = await geocode(city);
                const weather = await fetchWeather(geo.latitude, geo.longitude, geo.timezone);
                renderCurrent(weather, { name: geo.name, country: geo.country });
                renderForecast(weather);
                currentCity = city;
            } catch (err) {
                showError(err.message || 'Erreur inconnue');
            } finally {
                isLoading = false;
            }
        }

        // ============================================================
        //  EVENTS
        // ============================================================
        searchBtn.addEventListener('click', () => {
            const city = searchInput.value.trim();
            if (city) {
                loadWeather(city);
                searchInput.value = '';
            }
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                searchBtn.click();
            }
        });

        // ============================================================
        //  INIT
        // ============================================================
        loadWeather(DEFAULT_CITY);
    </script>
</body>
</html>
